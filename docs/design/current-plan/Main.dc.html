<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Poppins, system-ui, sans-serif; background: #12100E; }
    a { color: #FFA552; } a:hover { color: #FFB871; }
  </style>
</helmet>

<!-- MATERIAL YOU · the map is CONTAINED. A tonal card at the app's own 28dp cover radius, inset
     from the screen, with the artwork fitted inside it — so the rounded tonal edge is visible all
     the way round the picture instead of the map running to a hard corner. -->
<div style="width:390px;height:844px;background:#12100E;color:#F3EBE1;display:flex;flex-direction:column;overflow:hidden;font-family:Poppins,system-ui,sans-serif">

  <div style="height:44px;flex:0 0 auto"></div>

  <!-- band 1 · header -->
  <div style="display:flex;align-items:center;gap:2px;padding:10px 6px 0 18px;flex:0 0 auto">
    <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
      <div style="font-size:14px;line-height:20px;font-weight:600">Shadow Slave</div>
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">REV 3 · YOURS</div>
    </div>
    <div style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </div>
    <div style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </div>
  </div>

  <!-- band 2 · spine (M3 tab row) -->
  <div style="height:42px;margin:10px 14px;flex:0 0 auto;position:relative;display:flex">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:0.3px;color:#B6AB9C">Cast</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:0.3px;color:#FFA552">Map</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:0.3px;color:#B6AB9C">Timeline</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:0.3px;color:#B6AB9C">Pack</div>
    <div style="position:absolute;left:110px;bottom:0;width:40px;height:3px;border-radius:3px 3px 0 0;background:#FFA552"></div>
  </div>

  <!-- band 3 · the map card -->
  <div style="flex:1 1 auto;min-height:0;margin:4px 16px 16px 16px;position:relative;border-radius:28px;overflow:hidden;background:#1B1815">

    <!-- artwork, fitted: the tonal card shows above and below it as a real edge -->
    <div style="position:absolute;left:0;top:59px;width:358px;height:460px">
      <svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
        <defs>
          <linearGradient id="parchA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8DCC0"/><stop offset="0.55" stop-color="#DDCFAE"/><stop offset="1" stop-color="#CBBA95"/></linearGradient>
          <linearGradient id="seaA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C4B2"/><stop offset="1" stop-color="#9FAE9C"/></linearGradient>
          <radialGradient id="vigA" cx="0.5" cy="0.45" r="0.75"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#3A2E18" stop-opacity="0.42"/></radialGradient>
        </defs>
        <rect width="700" height="900" fill="url(#seaA)"/>
        <g stroke="#8C9A8A" stroke-width="1" fill="none" opacity="0.5"><path d="M0 120 Q 180 96 360 122 T 700 108"/><path d="M0 200 Q 180 176 360 202 T 700 188"/><path d="M0 760 Q 180 736 360 762 T 700 748"/><path d="M0 840 Q 180 816 360 842 T 700 828"/></g>
        <path d="M92 96 C 210 60 340 84 402 140 C 470 200 452 260 500 300 C 566 354 622 336 640 404 C 660 480 596 520 604 592 C 612 664 556 700 470 726 C 386 752 300 800 236 776 C 168 750 150 676 106 626 C 58 572 44 500 70 430 C 96 360 62 260 78 194 C 84 160 78 120 92 96 Z" fill="url(#parchA)" stroke="#6B5C3C" stroke-width="2.5"/>
        <g stroke="#8C7A52" stroke-width="1.1" fill="none" opacity="0.6"><path d="M120 180 C 200 150 280 190 320 240"/><path d="M150 300 C 240 280 300 320 360 300"/><path d="M110 470 C 190 450 250 490 330 470"/><path d="M180 620 C 260 596 340 636 420 610"/><path d="M330 700 C 400 680 470 706 540 686"/></g>
        <g fill="none" stroke="#6B5C3C" stroke-width="1.6" opacity="0.75"><path d="M190 210 l 22 -34 l 22 34 Z"/><path d="M232 214 l 26 -42 l 26 42 Z"/><path d="M418 372 l 24 -38 l 24 38 Z"/><path d="M458 376 l 20 -30 l 20 30 Z"/><path d="M262 536 l 22 -34 l 22 34 Z"/></g>
        <g stroke="#7C8B6F" stroke-width="1.8" fill="none" opacity="0.8"><path d="M330 150 C 320 240 372 300 356 380 C 342 452 392 500 380 574"/><path d="M150 380 C 220 396 262 372 300 400"/></g>
        <g fill="#6B7F5A" opacity="0.55"><circle cx="168" cy="250" r="5"/><circle cx="184" cy="262" r="4"/><circle cx="156" cy="266" r="4"/><circle cx="520" cy="470" r="5"/><circle cx="536" cy="484" r="4"/><circle cx="506" cy="486" r="4"/><circle cx="300" cy="660" r="5"/><circle cx="316" cy="672" r="4"/><circle cx="286" cy="674" r="4"/></g>
        <g opacity="0.55" stroke="#6B5C3C" stroke-width="1.4" fill="none"><circle cx="590" cy="150" r="34"/><path d="M590 110 l 0 80 M550 150 l 80 0 M590 116 l 9 25 l 25 9 l -25 9 l -9 25 l -9 -25 l -25 -9 l 25 -9 Z"/></g>
        <rect width="700" height="900" fill="url(#vigA)"/>
      </svg>
    </div>

    <!-- pins, anchored to the fitted rect -->
    <div style="position:absolute;left:76.7px;top:186.9px;display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;margin-left:-55px">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#5B4A6B,#2E2536);border:1.5px solid rgba(243,235,225,.55);box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">SU</div>
      <div style="padding:1px 7px;border-radius:8px;background:rgba(39,35,32,.92);font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#F3EBE1;white-space:nowrap">Sunny</div>
    </div>
    <div style="position:absolute;left:219.9px;top:263.5px;display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;margin-left:-55px">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#6B5138,#33241A);border:1.5px solid rgba(243,235,225,.55);box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">CA</div>
      <div style="padding:1px 7px;border-radius:8px;background:rgba(39,35,32,.92);font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#F3EBE1;white-space:nowrap">Cassie</div>
    </div>
    <div style="position:absolute;left:127.8px;top:299.3px;display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;margin-left:-55px">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#3E5A62,#1E2C31);border:1.5px solid rgba(243,235,225,.55);box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">NE</div>
      <div style="padding:1px 7px;border-radius:8px;background:rgba(39,35,32,.92);font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#F3EBE1;white-space:nowrap">Nephis</div>
    </div>
    <div style="position:absolute;left:245.4px;top:345.3px;display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;margin-left:-55px">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#6E3B3B,#33191A);border:2px solid #FFA552;box-shadow:0 0 0 4px rgba(255,165,82,.22),0 3px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">EI</div>
      <div style="padding:1px 7px;border-radius:8px;background:#FFA552;font-size:11px;line-height:14px;font-weight:600;letter-spacing:0.4px;color:#231405;white-space:nowrap">Eleven</div>
    </div>
    <div style="position:absolute;left:153.4px;top:396.4px;display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;margin-left:-55px">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#4C5B3A,#232B1B);border:1.5px solid rgba(243,235,225,.55);box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">KA</div>
      <div style="padding:1px 7px;border-radius:8px;background:rgba(39,35,32,.92);font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#F3EBE1;white-space:nowrap">Kai</div>
    </div>

    <!-- chrome sits INSIDE the card, inset 14dp so it clears the 28dp curve -->
    <div style="position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:16px;background:#272320;box-shadow:0 2px 10px rgba(0,0,0,.3)">
      <div style="display:flex;flex-direction:column;gap:1px">
        <div style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px">Sanctuary Coast</div>
        <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">5 pins · map 1 of 3</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B6AB9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <div style="position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-radius:20px;background:#272320;box-shadow:0 4px 18px rgba(0,0,0,.4)">
      <div style="width:36px;height:36px;border-radius:50%;flex:0 0 auto;background:linear-gradient(140deg,#6E3B3B,#33191A);border:1.5px solid #FFA552;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#EFE6DA">EI</div>
      <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
        <div style="font-size:14px;line-height:18px;font-weight:600;letter-spacing:0.1px">Eleven</div>
        <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">at the Forgotten Shore · since 4:12</div>
      </div>
      <div style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B6AB9C" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>
  </div>

  <!-- band 4 · dock -->
  <div style="flex:0 0 auto;margin:0 10px 10px 10px;border-radius:18px;background:#272320;display:flex;align-items:center;gap:10px;padding:10px 12px">
    <div style="width:38px;height:38px;border-radius:8px;flex:0 0 auto;background:linear-gradient(150deg,#3A2A44,#171019)"></div>
    <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
      <div style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Ch. 214 — The Forgotten Shore</div>
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">4:12:08</div>
    </div>
    <div style="display:flex;align-items:center;gap:2px">
      <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19 2 12l9-7v14Z"/><path d="M22 19l-9-7 9-7v14Z"/></svg></div>
      <div style="width:44px;height:44px;border-radius:50%;background:#FFA552;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#231405"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></div>
      <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m13 19 9-7-9-7v14Z"/><path d="m2 19 9-7-9-7v14Z"/></svg></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
