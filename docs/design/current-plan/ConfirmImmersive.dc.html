<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Poppins, system-ui, sans-serif; background: #0B0806; }
    a { color: #FFA552; } a:hover { color: #FFB871; }
  </style>
</helmet>

<div style="width:390px;height:844px;position:relative;overflow:hidden;color:#FFEBD5;font-family:Poppins,system-ui,sans-serif">

  <div style="position:absolute;inset:-40px;background:
       radial-gradient(60% 45% at 22% 18%, #8A4A2E 0%, rgba(138,74,46,0) 70%),
       radial-gradient(55% 40% at 78% 30%, #4A2E58 0%, rgba(74,46,88,0) 72%),
       radial-gradient(70% 50% at 50% 88%, #2B3A46 0%, rgba(43,58,70,0) 74%),
       linear-gradient(160deg,#3A2418,#160E0A);filter:blur(38px)"></div>
  <div style="position:absolute;left:0;top:171px;width:390px;height:501px;background:linear-gradient(160deg,#B9C4B2,#9FAE9C)"></div>
  <div style="position:absolute;left:0;right:0;top:0;height:230px;background:linear-gradient(180deg,rgba(31,20,10,.92) 0%,rgba(31,20,10,.78) 46%,rgba(31,20,10,.34) 78%,rgba(31,20,10,0) 100%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(0deg,rgba(31,20,10,.95) 0%,rgba(31,20,10,.80) 40%,rgba(31,20,10,.32) 76%,rgba(31,20,10,0) 100%)"></div>

  <div style="position:absolute;inset:0;display:flex;flex-direction:column">
    <div style="height:44px"></div>
    <div style="display:flex;align-items:center;padding:10px 6px 0 18px">
      <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1">
        <div style="font-size:14px;line-height:20px;font-weight:600">Shadow Slave</div>
        <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:rgba(255,231,205,.68)">REV 3 · YOURS</div>
      </div>
    </div>
    <div style="height:42px;margin:10px 14px;border-radius:50px;background:rgba(25,23,21,.52);padding:3px;display:flex">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,231,205,.68)">Cast</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;border-radius:50px;background:#FFA552;font-size:12px;font-weight:600;color:#231405">Map</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,231,205,.68)">Timeline</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,231,205,.68)">Pack</div>
    </div>
    <div style="flex:1"></div>
    <div style="height:60px;margin:0 10px 10px 10px;border-radius:24px;background:rgba(25,23,21,.62)"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.55)"></div>

  <!-- same anatomy, Immersive's fill: surfaceContainerHigh at 93% so the cover glows through -->
  <div style="position:absolute;left:28px;right:28px;top:288px;border-radius:28px;background:rgba(39,35,32,.93);backdrop-filter:blur(24px);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 14px 48px rgba(0,0,0,.65)">
    <div style="font-size:22px;line-height:27px;font-weight:700;letter-spacing:-0.2px">Delete this map?</div>
    <div style="font-size:14px;line-height:20px;color:rgba(255,231,205,.68)">
      “Sanctuary Coast”, its 6 pins and all 3 of its versions go with it. The picture files stay on disk. This can’t be undone.
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:4px">
      <div style="padding:10px 12px;border-radius:50px;font-size:14px;line-height:18px;font-weight:600;letter-spacing:0.1px;color:#FFA552">Cancel</div>
      <div style="padding:10px 12px;border-radius:50px;font-size:14px;line-height:18px;font-weight:600;letter-spacing:0.1px;color:#FF7A6B">Delete map</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
