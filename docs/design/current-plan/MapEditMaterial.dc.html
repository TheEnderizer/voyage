<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Poppins, system-ui, sans-serif; background: #12100E; }
    a { color: #FFA552; } a:hover { color: #FFB871; }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#12100E;color:#F3EBE1;display:flex;flex-direction:column;overflow:hidden;font-family:Poppins,system-ui,sans-serif">

  <div style="height:44px;flex:0 0 auto"></div>

  <!-- header: edit toggle is ACTIVE (filled accent) -->
  <div style="display:flex;align-items:center;gap:2px;padding:10px 6px 0 18px;flex:0 0 auto">
    <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
      <div style="font-size:14px;line-height:20px;font-weight:600">Shadow Slave</div>
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">REV 3 · YOURS</div>
    </div>
    <div style="width:38px;height:38px;border-radius:50%;background:#FFA552;display:flex;align-items:center;justify-content:center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#231405" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/><path d="M3 3l18 18"/></svg>
    </div>
    <div style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </div>
  </div>

  <div style="height:42px;margin:10px 14px;flex:0 0 auto;position:relative;display:flex">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:0.3px;color:#B6AB9C">Cast</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:0.3px;color:#FFA552">Map</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:0.3px;color:#B6AB9C">Timeline</div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:0.3px;color:#B6AB9C">Pack</div>
    <div style="position:absolute;left:110px;bottom:0;width:40px;height:3px;border-radius:3px 3px 0 0;background:#FFA552"></div>
  </div>

  <div style="flex:1 1 auto;min-height:0;margin:4px 16px 16px 16px;position:relative;border-radius:28px;overflow:hidden;background:#1B1815">

    <!-- artwork, zoomed to 2.5× and panned: the map is bigger than the pane -->
    <div style="position:absolute;left:-120px;top:-260px;width:900px;height:1157px">
      <svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
        <defs>
          <linearGradient id="parchC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8DCC0"/><stop offset="0.55" stop-color="#DDCFAE"/><stop offset="1" stop-color="#CBBA95"/></linearGradient>
          <linearGradient id="seaC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C4B2"/><stop offset="1" stop-color="#9FAE9C"/></linearGradient>
        </defs>
        <rect width="700" height="900" fill="url(#seaC)"/>
        <g stroke="#8C9A8A" stroke-width="1" fill="none" opacity="0.5"><path d="M0 120 Q 180 96 360 122 T 700 108"/><path d="M0 200 Q 180 176 360 202 T 700 188"/><path d="M0 760 Q 180 736 360 762 T 700 748"/><path d="M0 840 Q 180 816 360 842 T 700 828"/></g>
        <path d="M92 96 C 210 60 340 84 402 140 C 470 200 452 260 500 300 C 566 354 622 336 640 404 C 660 480 596 520 604 592 C 612 664 556 700 470 726 C 386 752 300 800 236 776 C 168 750 150 676 106 626 C 58 572 44 500 70 430 C 96 360 62 260 78 194 C 84 160 78 120 92 96 Z" fill="url(#parchC)" stroke="#6B5C3C" stroke-width="2.5"/>
        <g stroke="#8C7A52" stroke-width="1.1" fill="none" opacity="0.6"><path d="M120 180 C 200 150 280 190 320 240"/><path d="M150 300 C 240 280 300 320 360 300"/><path d="M110 470 C 190 450 250 490 330 470"/><path d="M180 620 C 260 596 340 636 420 610"/><path d="M330 700 C 400 680 470 706 540 686"/></g>
        <g fill="none" stroke="#6B5C3C" stroke-width="1.6" opacity="0.75"><path d="M190 210 l 22 -34 l 22 34 Z"/><path d="M232 214 l 26 -42 l 26 42 Z"/><path d="M418 372 l 24 -38 l 24 38 Z"/><path d="M458 376 l 20 -30 l 20 30 Z"/><path d="M262 536 l 22 -34 l 22 34 Z"/></g>
        <g stroke="#7C8B6F" stroke-width="1.8" fill="none" opacity="0.8"><path d="M330 150 C 320 240 372 300 356 380 C 342 452 392 500 380 574"/><path d="M150 380 C 220 396 262 372 300 400"/></g>
        <g fill="#6B7F5A" opacity="0.55"><circle cx="168" cy="250" r="5"/><circle cx="184" cy="262" r="4"/><circle cx="156" cy="266" r="4"/><circle cx="520" cy="470" r="5"/><circle cx="536" cy="484" r="4"/><circle cx="506" cy="486" r="4"/><circle cx="300" cy="660" r="5"/><circle cx="316" cy="672" r="4"/><circle cx="286" cy="674" r="4"/></g>
      </svg>
    </div>

    <!-- an already-placed pin, at this zoom -->
    <div style="position:absolute;left:98px;top:210px;display:flex;flex-direction:column;align-items:center;gap:2px;width:110px;margin-left:-38px">
      <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,#3E5A62,#1E2C31);border:1.5px solid rgba(243,235,225,.55);box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">NE</div>
      <div style="padding:1px 7px;border-radius:8px;background:rgba(39,35,32,.92);font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;white-space:nowrap">Nephis</div>
    </div>

    <!-- THE FIX, made visible: a pin added from "Add a pin" now lands in the middle of the
         view with a placement hint, instead of writing an element that renders nothing. -->
    <div style="position:absolute;left:172px;top:262px;display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;margin-left:-58px">
      <div style="padding:3px 9px;border-radius:8px;background:#FFA552;font-size:11px;line-height:14px;font-weight:600;letter-spacing:0.3px;color:#231405;white-space:nowrap">Drag Sunny into place</div>
      <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,#5B4A6B,#2E2536);border:2px dashed #FFA552;box-shadow:0 0 0 6px rgba(255,165,82,.16),0 4px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#EFE6DA">SU</div>
      <div style="padding:1px 7px;border-radius:8px;background:rgba(39,35,32,.92);font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;white-space:nowrap">Sunny</div>
    </div>

    <!-- map plate -->
    <div style="position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:16px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35)">
      <div style="display:flex;flex-direction:column;gap:1px">
        <div style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px">Sanctuary Coast</div>
        <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">6 pins · map 1 of 3</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B6AB9C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <!-- edit rail: the four authoring actions, off the height budget and onto the map -->
    <div style="position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px">
      <div style="width:40px;height:40px;border-radius:14px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></svg>
      </div>
      <div style="width:40px;height:40px;border-radius:14px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      </div>
      <div style="width:40px;height:40px;border-radius:14px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div style="width:40px;height:40px;border-radius:14px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF7A6B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
      </div>
    </div>

    <!-- versions: a chip that opens a sheet, replacing the permanent strip + hint paragraph
         that used to eat ~70dp under the map -->
    <div style="position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B6AB9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
      <div style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px">Versions · 3</div>
    </div>

    <!-- zoom readout + fit: only present above 1× -->
    <div style="position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:12px;background:rgba(39,35,32,.90);box-shadow:0 2px 10px rgba(0,0,0,.35)">
      <div style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px">2.5×</div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B6AB9C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"/></svg>
    </div>
  </div>

  <div style="flex:0 0 auto;margin:0 10px 10px 10px;border-radius:18px;background:#272320;display:flex;align-items:center;gap:10px;padding:10px 12px">
    <div style="width:38px;height:38px;border-radius:8px;flex:0 0 auto;background:linear-gradient(150deg,#3A2A44,#171019)"></div>
    <div style="display:flex;flex-direction:column;gap:1px;flex-grow:1;min-width:0">
      <div style="font-size:12px;line-height:16px;font-weight:600;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Ch. 214 — The Forgotten Shore</div>
      <div style="font-size:11px;line-height:14px;font-weight:500;letter-spacing:0.4px;color:#B6AB9C">4:12:08</div>
    </div>
    <div style="display:flex;align-items:center;gap:2px">
      <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19 2 12l9-7v14Z"/><path d="M22 19l-9-7 9-7v14Z"/></svg></div>
      <div style="width:44px;height:44px;border-radius:50%;background:#FFA552;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#231405"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></div>
      <div style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3EBE1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m13 19 9-7-9-7v14Z"/><path d="m2 19 9-7-9-7v14Z"/></svg></div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
